<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">RAG Pipeline</title>
  <desc id="desc">문서 수집부터 답변 생성까지 이어지는 RAG 파이프라인 흐름도</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f3a4a" />
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111827" flood-opacity="0.16" />
    </filter>
    <style>
      .bg { fill: #f7f8fb; }
      .lane { fill: #ffffff; stroke: #d8dee9; stroke-width: 2; }
      .lane-title { fill: #475569; font: 700 24px Arial, sans-serif; }
      .node { fill: #ffffff; stroke: #3b82f6; stroke-width: 3; filter: url(#shadow); }
      .node.query { stroke: #10b981; }
      .node.model { stroke: #f59e0b; }
      .text { fill: #111827; font: 700 23px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .subtext { fill: #64748b; font: 500 16px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #2f3a4a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 10 8; }
      .caption { fill: #334155; font: 700 30px Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="520" rx="0" />
  <text class="caption" x="48" y="58">RAG Pipeline</text>

  <rect class="lane" x="40" y="92" width="1200" height="165" rx="16" />
  <text class="lane-title" x="86" y="130">Indexing</text>

  <rect class="lane" x="40" y="292" width="1200" height="165" rx="16" />
  <text class="lane-title" x="86" y="330">Query</text>

  <rect class="node" x="95" y="158" width="145" height="68" rx="12" />
  <text class="text" x="167.5" y="187">문서 수집</text>
  <text class="subtext" x="167.5" y="209">Documents</text>

  <rect class="node" x="285" y="158" width="145" height="68" rx="12" />
  <text class="text" x="357.5" y="192">Parser</text>

  <rect class="node" x="475" y="158" width="145" height="68" rx="12" />
  <text class="text" x="547.5" y="192">Chunking</text>

  <rect class="node" x="665" y="158" width="145" height="68" rx="12" />
  <text class="text" x="737.5" y="192">Embedding</text>

  <rect class="node" x="855" y="158" width="180" height="68" rx="12" />
  <text class="text" x="945" y="187">Vector DB</text>
  <text class="subtext" x="945" y="209">Index Store</text>

  <rect class="node query" x="95" y="358" width="145" height="68" rx="12" />
  <text class="text" x="167.5" y="387">사용자 질문</text>
  <text class="subtext" x="167.5" y="409">Question</text>

  <rect class="node query" x="285" y="358" width="170" height="68" rx="12" />
  <text class="text" x="370" y="387">Query</text>
  <text class="subtext" x="370" y="409">Embedding</text>

  <rect class="node query" x="520" y="358" width="145" height="68" rx="12" />
  <text class="text" x="592.5" y="392">검색</text>

  <rect class="node model" x="730" y="358" width="145" height="68" rx="12" />
  <text class="text" x="802.5" y="392">Reranking</text>

  <rect class="node model" x="935" y="358" width="155" height="68" rx="12" />
  <text class="text" x="1012.5" y="387">LLM</text>
  <text class="subtext" x="1012.5" y="409">Context</text>

  <rect class="node model" x="1135" y="358" width="105" height="68" rx="12" />
  <text class="text" x="1187.5" y="392">답변</text>

  <path class="arrow" d="M240 192 H282" />
  <path class="arrow" d="M430 192 H472" />
  <path class="arrow" d="M620 192 H662" />
  <path class="arrow" d="M810 192 H852" />

  <path class="arrow" d="M240 392 H282" />
  <path class="arrow" d="M455 392 H517" />
  <path class="arrow" d="M665 392 H727" />
  <path class="arrow" d="M875 392 H932" />
  <path class="arrow" d="M1090 392 H1132" />

  <path class="arrow dashed" d="M945 226 V286 C945 330 830 330 668 370" />
</svg>
